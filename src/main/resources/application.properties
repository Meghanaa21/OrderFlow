
spring.application.name=backend

spring.datasource.url=${ORDERFLOW_DB_URL:jdbc:postgresql://localhost:5433/orderflow}
spring.datasource.username=${ORDERFLOW_DB_USERNAME:orderflow_app}
spring.datasource.password=${ORDERFLOW_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

orderflow.jwt.secret=${ORDERFLOW_JWT_SECRET}
orderflow.jwt.expiration-ms=900000